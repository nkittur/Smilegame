<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smile Pong</title>
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a1a;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    h1 {
      margin-top: 10px;
      font-size: 1.6rem;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #00e0ff, #ff6ec7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #game-area {
      position: relative;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 660px;
      padding: 0 8px;
    }

    #canvas-wrap {
      position: relative;
      width: 100%;
      max-width: 640px;
    }

    canvas#pong {
      display: block;
      width: 100%;
      height: auto;
      border: 2px solid #1a1a3a;
      border-radius: 8px;
      background: #0d0d24;
    }

    #camera-box {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 100px;
      height: 75px;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      z-index: 5;
    }

    #camera-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #expression-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      text-align: center;
      padding: 2px 4px;
      font-size: 0.65rem;
      font-weight: bold;
      background: rgba(0,0,0,0.6);
    }

    #bottom-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 640px;
      margin-top: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    #hud {
      display: flex;
      gap: 24px;
      font-size: 1rem;
      opacity: 0.8;
    }

    #status-bar {
      margin-top: 6px;
      font-size: 0.85rem;
      opacity: 0.7;
      text-align: center;
      max-width: 640px;
      padding: 0 12px;
    }

    #start-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 26, 0.88);
      border-radius: 8px;
      z-index: 10;
      cursor: pointer;
    }

    #start-overlay h2 {
      font-size: 1.4rem;
      margin-bottom: 10px;
    }

    #start-overlay p {
      font-size: 0.9rem;
      opacity: 0.75;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.5;
      padding: 0 20px;
    }

    #start-overlay .btn {
      padding: 12px 36px;
      font-size: 1.1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: linear-gradient(135deg, #00e0ff, #8050ff);
      color: #fff;
      font-weight: bold;
      letter-spacing: 1px;
    }

    #start-overlay .btn:hover {
      filter: brightness(1.2);
    }

    .bar-container {
      flex: 1;
      min-width: 160px;
      max-width: 300px;
    }

    .bar-track {
      position: relative;
      height: 16px;
      background: #1a1a3a;
      border-radius: 8px;
      overflow: hidden;
    }

    .bar-fill-left {
      position: absolute;
      right: 50%;
      height: 100%;
      background: linear-gradient(270deg, #ff6ec7, #ff3860);
      border-radius: 8px 0 0 8px;
      transition: width 0.15s;
    }

    .bar-fill-right {
      position: absolute;
      left: 50%;
      height: 100%;
      background: linear-gradient(90deg, #00e0ff, #00b8d4);
      border-radius: 0 8px 8px 0;
      transition: width 0.15s;
    }

    .bar-center {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #fff;
      transform: translateX(-1px);
      z-index: 1;
    }

    .bar-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      opacity: 0.6;
      margin-top: 2px;
    }

    /* ── Larger screens: side-by-side layout ── */
    @media (min-width: 920px) {
      #game-area {
        flex-direction: row;
        align-items: flex-start;
        gap: 16px;
        max-width: 920px;
      }
      #canvas-wrap {
        width: 640px;
        flex-shrink: 0;
      }
      #camera-box {
        position: relative;
        top: auto; right: auto;
        width: 240px;
        height: 180px;
      }
      #expression-label {
        font-size: 1.1rem;
        padding: 6px;
      }
      #sidebar {
        display: flex;
        flex-direction: column;
      }
      #bottom-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        margin-top: 8px;
      }
      .bar-container {
        width: 240px;
        max-width: 240px;
      }
      h1 { font-size: 2rem; margin-top: 18px; }
    }
  </style>
</head>
<body>

<h1>SMILE PONG</h1>

<div id="game-area">
  <div id="canvas-wrap">
    <canvas id="pong" width="640" height="480"></canvas>
    <div id="camera-box">
      <video id="cam" autoplay muted playsinline></video>
      <div id="expression-label">Loading...</div>
    </div>
    <div id="start-overlay">
      <h2>Smile Pong</h2>
      <p>
        Control your paddle with your face!<br>
        <strong>Smile</strong> to move <em>down</em><br>
        <strong>Frown</strong> to move <em>up</em><br>
        Neutral face keeps the paddle still.
      </p>
      <button class="btn" id="start-btn">Start Game</button>
    </div>
  </div>

  <div id="sidebar">
    <div id="bottom-bar">
      <div id="hud">
        <span>You: <strong id="score-player">0</strong></span>
        <span>CPU: <strong id="score-cpu">0</strong></span>
      </div>

      <div class="bar-container">
        <div class="bar-track">
          <div class="bar-center"></div>
          <div class="bar-fill-left" id="bar-left"></div>
          <div class="bar-fill-right" id="bar-right"></div>
        </div>
        <div class="bar-labels">
          <span>Frown</span>
          <span>Neutral</span>
          <span>Smile</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="status-bar">Initializing face detection model...</div>

<script>
// ─── Game constants ──────────────────────────────────────────
const CANVAS_W = 640, CANVAS_H = 480;
const PADDLE_W = 12, PADDLE_H = 90;
const BALL_R = 8;
const PADDLE_SPEED = 5.5;
const CPU_SPEED = 3.5;
const BALL_BASE_SPEED = 5;

// ─── State ───────────────────────────────────────────────────
let playerY = CANVAS_H / 2 - PADDLE_H / 2;
let cpuY    = CANVAS_H / 2 - PADDLE_H / 2;
let ball    = { x: CANVAS_W / 2, y: CANVAS_H / 2, vx: BALL_BASE_SPEED, vy: 0 };
let scorePlayer = 0, scoreCpu = 0;
let running = false;
let expressionValue = 0;   // -1 = full frown, +1 = full smile
let modelsReady = false;

const canvas  = document.getElementById('pong');
const ctx     = canvas.getContext('2d');
const video   = document.getElementById('cam');
const statusBar  = document.getElementById('status-bar');
const exprLabel  = document.getElementById('expression-label');
const barLeft    = document.getElementById('bar-left');
const barRight   = document.getElementById('bar-right');

// ─── Camera ──────────────────────────────────────────────────
async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: 320, height: 240, facingMode: 'user' }
  });
  video.srcObject = stream;
  await video.play();
}

// ─── Face-api setup ──────────────────────────────────────────
const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights/';

async function loadModels() {
  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);
  modelsReady = true;
  statusBar.textContent = 'Face models loaded. Click Start Game!';
}

// ─── Expression detection loop ───────────────────────────────
async function detectLoop() {
  if (!modelsReady) { requestAnimationFrame(detectLoop); return; }

  const result = await faceapi
    .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.4 }))
    .withFaceExpressions();

  if (result) {
    const expr = result.expressions;
    const smile = expr.happy || 0;
    const frown = Math.max(expr.angry || 0, expr.disgusted || 0, expr.sad || 0);

    // Map to -1..+1 (frown..smile)
    const raw = smile - frown;
    // Smoothing
    expressionValue += (raw - expressionValue) * 0.35;

    // Update UI
    const absVal = Math.abs(expressionValue);
    if (expressionValue > 0.08) {
      exprLabel.textContent = `Smile ${'😊'.repeat(Math.min(3, Math.ceil(absVal * 3)))}`;
      barRight.style.width = (absVal * 50) + '%';
      barLeft.style.width = '0%';
    } else if (expressionValue < -0.08) {
      exprLabel.textContent = `Frown ${'😠'.repeat(Math.min(3, Math.ceil(absVal * 3)))}`;
      barLeft.style.width = (absVal * 50) + '%';
      barRight.style.width = '0%';
    } else {
      exprLabel.textContent = 'Neutral 😐';
      barLeft.style.width = '0%';
      barRight.style.width = '0%';
    }
  }

  setTimeout(detectLoop, 120);  // ~8 fps detection is plenty
}

// ─── Ball helpers ────────────────────────────────────────────
function resetBall(direction) {
  ball.x = CANVAS_W / 2;
  ball.y = CANVAS_H / 2;
  const angle = (Math.random() - 0.5) * Math.PI / 3;  // ±30°
  ball.vx = BALL_BASE_SPEED * direction;
  ball.vy = BALL_BASE_SPEED * Math.sin(angle);
}

// ─── Game loop ───────────────────────────────────────────────
function update() {
  // ── Player paddle (expression-driven) ──
  if (expressionValue > 0.08) {
    playerY += PADDLE_SPEED * Math.min(expressionValue * 2, 1);
  } else if (expressionValue < -0.08) {
    playerY += PADDLE_SPEED * Math.max(expressionValue * 2, -1);
  }
  playerY = Math.max(0, Math.min(CANVAS_H - PADDLE_H, playerY));

  // ── CPU paddle (simple tracking) ──
  const cpuCenter = cpuY + PADDLE_H / 2;
  if (ball.y < cpuCenter - 15) cpuY -= CPU_SPEED;
  if (ball.y > cpuCenter + 15) cpuY += CPU_SPEED;
  cpuY = Math.max(0, Math.min(CANVAS_H - PADDLE_H, cpuY));

  // ── Ball movement ──
  ball.x += ball.vx;
  ball.y += ball.vy;

  // Top / bottom walls
  if (ball.y - BALL_R <= 0)        { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }
  if (ball.y + BALL_R >= CANVAS_H) { ball.y = CANVAS_H - BALL_R; ball.vy = -Math.abs(ball.vy); }

  // Player paddle collision (left side)
  if (ball.vx < 0 &&
      ball.x - BALL_R <= PADDLE_W + 10 &&
      ball.x - BALL_R >= 10 &&
      ball.y >= playerY && ball.y <= playerY + PADDLE_H) {
    ball.x = PADDLE_W + 10 + BALL_R;
    const hit = (ball.y - (playerY + PADDLE_H / 2)) / (PADDLE_H / 2);
    ball.vx = BALL_BASE_SPEED + Math.abs(hit) * 1.5;
    ball.vy = hit * BALL_BASE_SPEED;
  }

  // CPU paddle collision (right side)
  if (ball.vx > 0 &&
      ball.x + BALL_R >= CANVAS_W - PADDLE_W - 10 &&
      ball.x + BALL_R <= CANVAS_W - 10 &&
      ball.y >= cpuY && ball.y <= cpuY + PADDLE_H) {
    ball.x = CANVAS_W - PADDLE_W - 10 - BALL_R;
    const hit = (ball.y - (cpuY + PADDLE_H / 2)) / (PADDLE_H / 2);
    ball.vx = -(BALL_BASE_SPEED + Math.abs(hit) * 1.5);
    ball.vy = hit * BALL_BASE_SPEED;
  }

  // Scoring
  if (ball.x < -BALL_R) {
    scoreCpu++;
    document.getElementById('score-cpu').textContent = scoreCpu;
    resetBall(1);
  }
  if (ball.x > CANVAS_W + BALL_R) {
    scorePlayer++;
    document.getElementById('score-player').textContent = scorePlayer;
    resetBall(-1);
  }
}

function draw() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

  // Center line
  ctx.setLineDash([6, 8]);
  ctx.strokeStyle = '#1e1e4a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(CANVAS_W / 2, 0);
  ctx.lineTo(CANVAS_W / 2, CANVAS_H);
  ctx.stroke();
  ctx.setLineDash([]);

  // Paddles
  const grad1 = ctx.createLinearGradient(10, playerY, 10, playerY + PADDLE_H);
  grad1.addColorStop(0, '#00e0ff');
  grad1.addColorStop(1, '#8050ff');
  ctx.fillStyle = grad1;
  ctx.beginPath();
  ctx.roundRect(10, playerY, PADDLE_W, PADDLE_H, 4);
  ctx.fill();

  const grad2 = ctx.createLinearGradient(CANVAS_W - PADDLE_W - 10, cpuY, CANVAS_W - 10, cpuY + PADDLE_H);
  grad2.addColorStop(0, '#ff6ec7');
  grad2.addColorStop(1, '#ff3860');
  ctx.fillStyle = grad2;
  ctx.beginPath();
  ctx.roundRect(CANVAS_W - PADDLE_W - 10, cpuY, PADDLE_W, PADDLE_H, 4);
  ctx.fill();

  // Ball
  const ballGrad = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, BALL_R);
  ballGrad.addColorStop(0, '#fff');
  ballGrad.addColorStop(1, '#aaa');
  ctx.fillStyle = ballGrad;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
  ctx.fill();

  // Scores (on canvas)
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.font = 'bold 64px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(scorePlayer, CANVAS_W / 4, 80);
  ctx.fillText(scoreCpu, (CANVAS_W / 4) * 3, 80);
}

function gameLoop() {
  if (!running) return;
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ─── Keyboard fallback ──────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => { keys[e.key] = true; });
document.addEventListener('keyup',   e => { keys[e.key] = false; });

// Add keyboard support as supplementary control
function addKeyboardToUpdate() {
  const origUpdate = update;
  update = function() {
    if (keys['ArrowUp'])   expressionValue = Math.max(expressionValue - 0.15, -1);
    if (keys['ArrowDown']) expressionValue = Math.min(expressionValue + 0.15,  1);
    origUpdate();
  };
}

// ─── Init ────────────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', async () => {
  document.getElementById('start-overlay').style.display = 'none';
  if (!modelsReady) {
    statusBar.textContent = 'Still loading models, please wait...';
    return;
  }
  statusBar.textContent = 'Game running! Smile to move down, frown to move up.';
  running = true;
  resetBall(Math.random() > 0.5 ? 1 : -1);
  addKeyboardToUpdate();
  gameLoop();
});

(async () => {
  try {
    await startCamera();
    statusBar.textContent = 'Camera ready. Loading face detection models...';
    await loadModels();
    detectLoop();
  } catch (err) {
    statusBar.textContent = 'Camera error: ' + err.message + '. Use Arrow keys as fallback.';
    modelsReady = true;  // allow game to start with keyboard fallback
  }
})();
</script>

</body>
</html>
